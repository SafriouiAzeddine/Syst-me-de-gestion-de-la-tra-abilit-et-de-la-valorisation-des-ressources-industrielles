<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RE:SOURCE{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body>
<div class="d-flex">
  <aside class="sidebar d-none d-lg-flex flex-column p-3 text-white">
    <a href="{{ url_for('dashboard.index') }}" class="text-decoration-none mb-4">
      <div class="brand-mark fw-bold">RE:SOURCE</div>
      <small class="text-white-50">Cycle de vie des ressources</small>
    </a>
    {% include "partials/_nav.html" %}
  </aside>

  <div class="flex-grow-1">
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container-fluid">
        <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileNav">
          <i class="bi bi-list"></i>
        </button>
        <span class="navbar-brand d-lg-none ms-2">RE:SOURCE</span>
        <form class="d-flex align-items-center ms-auto gap-2" method="post" action="{{ url_for('set_entreprise') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <label class="form-label mb-0 small text-muted" for="entreprise_id">Entreprise active</label>
          <select class="form-select form-select-sm" id="entreprise_id" name="entreprise_id" onchange="this.form.submit()" style="min-width: 16rem;">
            <option value="">— Choisir —</option>
            {% for e in all_entreprises %}
              <option value="{{ e.id_entreprise }}" {% if acting_entreprise and acting_entreprise.id_entreprise == e.id_entreprise %}selected{% endif %}>
                {{ e.nom }} ({{ e.ville }})
              </option>
            {% endfor %}
          </select>
        </form>
      </div>
    </nav>

    <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="mobileNav">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">Menu</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body">
        {% include "partials/_nav.html" %}
      </div>
    </div>

    <main class="p-3 p-md-4">
      {% include "partials/_flash.html" %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
